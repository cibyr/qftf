[package]
name = "qftf"
version = "0.2.0"
authors = ["Ian Cullinan <cibyr@cibyr.com>"]
edition = "2024"
description = "QR code file transfers"
keywords = ["qrcode", "iroh"]
categories = ["command-line-utilities"]
homepage = "https://github.com/cibyr/qftf/"
repository = "https://github.com/cibyr/qftf/"
readme = "README.md"
license = "WTFPL"

[package.metadata.wix]
upgrade-guid = "AFA294FD-E30D-4F47-9260-8B9AFEDD4B4F"
path-guid = "935A3186-C01F-49C4-AD59-E917742AE5E4"
license = false
eula = false

[dependencies]
anyhow = "1.0"
fltk = { version = "1.5", features = ["fltk-bundled", "use-ninja"] }
iroh = "1.0"
qrcode = "0.14"
rand = "0.10"
tokio = "1.52"
tokio-util = "0.7.18"
tracing = "0.1.44"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
human-repr = { version = "1.1.0", features = ["space", "iec", "1024"] }
strum = { version = "0.28", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
